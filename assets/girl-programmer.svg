  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".35"/></filter>
</defs>
<rect width="700" height="520" rx="34" fill="url(#bg)"/>
<circle cx="92" cy="92" r="5" fill="#67e8f9"/><circle cx="610" cy="85" r="7" fill="#f9a8d4"/><circle cx="570" cy="420" r="5" fill="#a7f3d0"/>
